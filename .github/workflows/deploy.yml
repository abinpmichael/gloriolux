name: Test and Deploy via FTP

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐘 Setup PHP for Testing
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        
    - name: 🔍 Run Tests (PHP Syntax Check)
      run: |
        # This will scan all PHP files to ensure there are no syntax errors
        find . -name "*.php" ! -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  deploy-to-live:
    name: 🚀 Deploy to Live Server (FTP)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production # 🛑 This creates the manual approval step in GitHub!
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: 🚚 Checkout code
      uses: actions/checkout@v4
      
    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        exclude: |
          **/.git*
          **/.git*/**
          **/.github/**
          scratch/**
          *.log
          README.md
          DEPLOYMENT_GUIDE.md
          Dockerfile
          .dockerignore
          server/**
          assets/index-*
          favicon.svg
          icons.svg
          index.html
          logo.png
          og-image.png
          sitemap.xml
          widget.js
